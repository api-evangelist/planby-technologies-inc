name: Planby Technologies, Inc.
description: 'Planby Technologies, Inc. (PLANBY) is a Seoul-based AI transformation partner for
  architecture and construction organizations, helping construction firms, architectural offices, and
  interior studios adopt AI-powered workflows. Its products include PLANA (interior and concept CG
  rendering automation) and PLAD (apartment exterior design visualization), which cut visualization
  timeframes from days to hours, alongside its AX Program for organizational AI transformation
  (diagnosis, training, and workflow integration) and Knowledge System Building that structures
  construction data such as blueprints, specifications, and defect records into domain-specific data
  frameworks. Clients include Samsung E&A, POSCO E&C, Hyundai, Daewoo E&C, and Samsung C&T. Backed by
  500 Global. PLANBY publishes no public API or developer surface at this time.'
